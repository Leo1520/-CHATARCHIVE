<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="caGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="caCard" x1="28" y1="36" x2="100" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.9" />
    </linearGradient>
    <filter id="caShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#caGrad)" filter="url(#caShadow)" />
  
  <!-- Chat Bubble Tail -->
  <path d="M30 92 L20 108 L44 98 Z" fill="#047857" opacity="0.9" />

  <!-- Archive Box / Layers -->
  <rect x="30" y="32" width="68" height="18" rx="7" fill="url(#caCard)" />
  <rect x="36" y="46" width="56" height="42" rx="6" fill="#ffffff" fill-opacity="0.22" />
  <rect x="34" y="54" width="60" height="38" rx="8" fill="url(#caCard)" />
  
  <!-- Drawer Handle / Lock notch -->
  <rect x="52" y="62" width="24" height="6" rx="3" fill="#059669" />
  
  <!-- Security Shield / Check dot -->
  <circle cx="86" cy="82" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
  <path d="M83 82 L85.5 84.5 L89.5 79.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
